<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lamp Inventory Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{font-family:Arial,sans-serif;margin:15px;background:#f5f5f5}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}
input,button,select{width:100%;padding:10px;margin:5px 0}
button{cursor:pointer;background:#0078d4;color:#fff;border:none;border-radius:6px}
#reader{width:100%}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px}
</style>
</head>
<body>
<h2>Lamp Inventory Scanner</h2>
<div class='card'>
<label>Location Code</label>
<input id='location' placeholder='SHELF-A3'>
<button onclick='setMode("location")'>Scan Location</button>
<label>Lamp Code</label>
<input id='lamp' placeholder='LAMP-0142'>
<button onclick='setMode("lamp")'>Scan Lamp</button>
<button onclick='assignLamp()'>Assign Lamp to Location</button>
</div>
<div class='card'><div id='reader'></div></div>
<div class='card'>
<input id='search' placeholder='Search lamp or location' onkeyup='render()'>
<button onclick='exportCSV()'>Export CSV</button>
</div>
<div class='card'>
<table>
<thead><tr><th>Lamp</th><th>Location</th></tr></thead>
<tbody id='results'></tbody>
</table>
</div>
<script>
let mode='location';
let inventory=JSON.parse(localStorage.getItem('lampInventory')||'[]');
function save(){localStorage.setItem('lampInventory',JSON.stringify(inventory));render();}
function setMode(m){mode=m;}
function assignLamp(){
 const loc=document.getElementById('location').value.trim();
 const lamp=document.getElementById('lamp').value.trim();
 if(!loc||!lamp)return alert('Enter both values');
 inventory=inventory.filter(x=>x.lamp!==lamp);
 inventory.push({lamp,location:loc});
 save();
 document.getElementById('lamp').value='';
}
function render(){
 const q=document.getElementById('search').value.toLowerCase();
 document.getElementById('results').innerHTML=inventory.filter(r=>!q||r.lamp.toLowerCase().includes(q)||r.location.toLowerCase().includes(q))
 .map(r=>`<tr><td>${r.lamp}</td><td>${r.location}</td></tr>`).join('');
}
function exportCSV(){
 let csv='Lamp,Location\n'+inventory.map(r=>`${r.lamp},${r.location}`).join('\n');
 let a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
 a.download='lamp_inventory.csv';a.click();
}
const scanner=new Html5Qrcode('reader');
Html5Qrcode.getCameras().then(()=>{
 scanner.start({facingMode:'environment'},{fps:10,qrbox:250},decoded=>{
   if(mode==='location') document.getElementById('location').value=decoded;
   else document.getElementById('lamp').value=decoded;
 });
});
render();
</script>
</body>
</html>
